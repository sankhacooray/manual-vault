<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Scan · Manual Vault</title>
  <link rel="icon" type="image/svg+xml" href="assets/icon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <!--
    Camera page for the Apps Script web app. Apps Script serves its UI in
    iframes without camera permission, so the app opens this top-level page
    instead. The decoded content goes back to the app with postMessage and
    this tab closes. With no opener (or no ack), it hands off via the app's
    ?scan= parameter.
  -->
  <style>
    * { box-sizing: border-box; }
    html { background: #0b1017; overscroll-behavior: none; }
    body {
      margin: 0; min-height: 100vh; min-height: 100dvh; color: #e7ecf3; overscroll-behavior: none;
      background: radial-gradient(1200px 600px at 50% -10%, rgba(47, 124, 240, .18), transparent 60%), #0b1017;
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 18px;
    }
    .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 16.5px; letter-spacing: -.01em; margin-bottom: 20px; }
    .brand-mark { width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; background: #2f7cf0; color: #fff; font-size: 14px; }
    .frame {
      width: min(92vw, 460px); padding: 8px; border-radius: 22px;
      background: rgba(255, 255, 255, .05); border: 1px solid rgba(255, 255, 255, .08);
      box-shadow: 0 24px 60px rgba(0, 0, 0, .45);
    }
    #qr-reader { width: 100%; border-radius: 16px; overflow: hidden; background: #000; border: none !important; }
    #qr-reader video { display: block; }
    .hint {
      display: inline-flex; align-items: center; gap: 9px; margin-top: 18px; padding: 10px 16px; border-radius: 999px;
      background: rgba(255, 255, 255, .07); color: #cfd8e3; font-size: 14px; text-align: center; max-width: min(92vw, 460px);
    }
    .hint a { color: #8ab4f8; }
    .cam-controls { width: min(92vw, 460px); margin-top: 14px; }
    .cam-controls:empty { display: none; }
    .cam-controls .zoom { display: flex; align-items: center; gap: 12px; color: #cfd8e3; padding: 0 6px; }
    .cam-controls .zoom input { flex: 1; accent-color: #4b90f5; }
    .cam-controls .cam-tip { color: #97a2b3; font-size: 12.5px; text-align: center; margin-top: 8px; }
  </style>
</head>
<body>
  <div class="brand"><span class="brand-mark"><i class="fa-solid fa-box-archive"></i></span>Manual Vault</div>
  <div class="frame"><div id="qr-reader"></div></div>
  <div class="hint" id="hint">Point the camera at a manual or setup QR code</div>
  <div class="cam-controls" id="cam-controls"></div>

  <script>
    var APP_URL = 'https://script.google.com/macros/s/AKfycbyAbXPC3dW7xTE11NTwt5yH7jXktBevWeUWUdkqw94hp7Mw8zRyW8Cui0JJSfDNw54Aew/exec';
    var hint = document.getElementById('hint');
    var scanner;
    var done = false;

    // Sharper feed + QR-only decoding (native BarcodeDetector where available).
    // Keep videoConstraints to plain keys: html5-qrcode drops the whole object
    // if it sees one it doesn't recognise. Focus is applied after start.
    var SCAN_CONFIG = {
      fps: 15,
      qrbox: function (w, h) { var s = Math.floor(Math.min(w, h) * 0.7); return { width: s, height: s }; },
      videoConstraints: {
        facingMode: 'environment',
        width: { ideal: 1920 }, height: { ideal: 1080 }
      }
    };
    function newScanner(id) {
      return new Html5Qrcode(id, {
        formatsToSupport: [Html5QrcodeSupportedFormats.QR_CODE],
        experimentalFeatures: { useBarCodeDetectorIfSupported: true },
        verbose: false
      });
    }

    // Focus and zoom, where the camera supports them: continuous autofocus,
    // tap-to-focus on the preview, and a zoom slider so the phone can be held
    // further back than its minimum focus distance.
    function tuneCamera(readerId, controlsId) {
      var video = document.querySelector('#' + readerId + ' video');
      var track = video && video.srcObject && video.srcObject.getVideoTracks()[0];
      var controls = document.getElementById(controlsId);
      controls.innerHTML = '';
      if (!track || !track.getCapabilities) return;
      var caps = track.getCapabilities();
      var modes = caps.focusMode || [];
      var apply = function (c) { return track.applyConstraints({ advanced: [c] }).catch(function () {}); };

      if (modes.indexOf('continuous') !== -1) apply({ focusMode: 'continuous' });

      var canTap = modes.indexOf('single-shot') !== -1 || modes.indexOf('manual') !== -1;
      if (canTap) {
        var poi = !!(navigator.mediaDevices.getSupportedConstraints() || {}).pointsOfInterest;
        video.style.cursor = 'crosshair';
        video.addEventListener('click', function (e) {
          var r = video.getBoundingClientRect();
          var x = (e.clientX - r.left) / r.width, y = (e.clientY - r.top) / r.height;
          if (video.style.transform) x = 1 - x;  // mirrored preview
          var c = { focusMode: modes.indexOf('single-shot') !== -1 ? 'single-shot' : 'manual' };
          if (poi) c.pointsOfInterest = [{ x: x, y: y }];
          apply(c).then(function () {
            if (modes.indexOf('continuous') !== -1) setTimeout(function () { apply({ focusMode: 'continuous' }); }, 2500);
          });
        });
      }

      var hints = [];
      if (caps.zoom && caps.zoom.max > caps.zoom.min) {
        var row = document.createElement('label');
        row.className = 'zoom';
        row.innerHTML = '<i class="fa-solid fa-magnifying-glass-minus"></i>' +
          '<input type="range" min="' + caps.zoom.min + '" max="' + Math.min(caps.zoom.max, 8) + '" step="' + (caps.zoom.step || 0.1) +
          '" value="' + ((track.getSettings() || {}).zoom || caps.zoom.min) + '">' +
          '<i class="fa-solid fa-magnifying-glass-plus"></i>';
        row.querySelector('input').addEventListener('input', function () { apply({ zoom: Number(this.value) }); });
        controls.appendChild(row);
        hints.push('blurry? step back and zoom in');
      }
      if (canTap) hints.push('tap the preview to focus');
      if (hints.length) {
        var h = document.createElement('div');
        h.className = 'cam-tip';
        h.textContent = hints.join(' · ').replace(/^./, function (c) { return c.toUpperCase(); });
        controls.appendChild(h);
      }
    }

    // Mirror the preview like a selfie view for front/desktop cameras, but not
    // for a phone's rear camera. Desktop webcams usually report no facingMode.
    function mirrorPreview(readerId) {
      var video = document.querySelector('#' + readerId + ' video');
      var track = video && video.srcObject && video.srcObject.getVideoTracks()[0];
      var facing = track && track.getSettings ? track.getSettings().facingMode : '';
      if (video) video.style.transform = facing === 'environment' ? '' : 'scaleX(-1)';
    }

    function handOff(text) {
      var acked = false;
      window.addEventListener('message', function (e) {
        if (e.source === window.opener && e.data && e.data.type === 'manual-vault-ack') {
          acked = true;
          window.close();
          hint.textContent = 'Sent to Manual Vault — you can close this tab.';
        }
      });
      if (window.opener) {
        try { window.opener.postMessage({ type: 'manual-vault-scan', text: text }, '*'); } catch (e) {}
      }
      setTimeout(function () {
        if (!acked) location.replace(APP_URL + '?scan=' + encodeURIComponent(text));
      }, 2000);
    }

    scanner = newScanner('qr-reader');
    scanner.start(
      { facingMode: 'environment' },
      SCAN_CONFIG,
      function (text) {
        if (done) return;
        text = String(text || '').trim();
        if (!text) return;
        done = true;
        hint.textContent = 'Found it — sending to Manual Vault...';
        scanner.stop().catch(function () {}).then(function () { handOff(text); });
      },
      function () { /* per-frame decode misses are normal */ }
    ).then(function () {
      mirrorPreview('qr-reader');
      tuneCamera('qr-reader', 'cam-controls');
    }).catch(function () {
      hint.innerHTML = 'Camera blocked. Allow camera access for this site in the address bar, then ' +
        '<a href="">reload</a>.';
    });
  </script>
</body>
</html>
